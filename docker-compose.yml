services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs/conf:/etc/letsencrypt
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${BRIDGE_IMAGE:-somashaker23/smartflo-bridge}:latest
    container_name: bridge-api
    command: ["api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  agent:
    image: ${AGENT_IMAGE:-somashaker23/ltfs-agent-pl}:latest
    container_name: ltfs-agent
    command: ["python", "start_agent.py", "start"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
