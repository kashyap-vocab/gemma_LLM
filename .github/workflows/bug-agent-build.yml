name: bug/* agent build

on:
  push:
    branches:
      - bug/**
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name from branch
        run: echo "IMAGE_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Cython Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: false
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        if: always()
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: Cython build for client deployment
          readme-filepath: ./README.md

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names from branch
        run: |
          SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "AGENT_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/${SLUG}" >> $GITHUB_ENV
          echo "BRIDGE_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/${SLUG}-smartflo" >> $GITHUB_ENV

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: /tmp/

      - name: Deploy agent to remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: AGENT_IMAGE,BRIDGE_IMAGE
          script: |
            cd /tmp
            docker compose stop agent || true
            docker compose rm -f agent || true
            fuser -k 8000/tcp || true
            docker pull $AGENT_IMAGE:latest
            AGENT_IMAGE=$AGENT_IMAGE BRIDGE_IMAGE=$BRIDGE_IMAGE docker compose up -d --force-recreate agent