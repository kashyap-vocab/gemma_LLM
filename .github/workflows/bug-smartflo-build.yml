name: bug/* smartflo build

on:
  push:
    branches:
      - bug/**
    paths:
      - 'smart-flo/**'
      - 'smartflo.Dockerfile'
      - 'api/**'
      - 'db/**'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'frontend/package-lock.json'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'setup.py'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name from branch
        run: echo "IMAGE_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')-smartflo" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Cython Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./smartflo.Dockerfile
          push: true
          no-cache: false
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        if: always()
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: Cython build for client deployment
          readme-filepath: ./README.md